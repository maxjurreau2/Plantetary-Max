name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Portal-OS Docker image
        run: |
          docker build \
            . \
            --file docker/Dockerfile \
            --tag ghcr.io/${{ github.repository_owner }}/portal-os:latest

      - name: Push Portal-OS Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/portal-os:latest
